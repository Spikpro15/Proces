name: Build PC Agent & Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-Android-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

  build-pc-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Standalone Windows EXE
        working-directory: pc_agent
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Copy helper script
        shell: pwsh
        run: Copy-Item pc_agent/setup_tools.bat pc_agent/publish/
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-Windows-EXE
          path: pc_agent/publish/
